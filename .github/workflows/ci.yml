name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22]
        include:
          - os: windows-latest
            node: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 依存パッケージを入れる
        run: npm ci

      - name: start.bat の確認(Windows のみ)
        if: runner.os == 'Windows'
        shell: cmd
        run: start.bat --check

      - name: 型チェックと lint
        run: npm run check

      - name: サンプルの静止画とはみ出しの検査
        run: npm run stills -- sample

      - name: 長い文字・多い項目のはみ出しの検査
        run: npm run stills -- projects/はみ出し確認.json

      - name: 静止画を保存する
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stills-${{ matrix.os }}-node${{ matrix.node }}
          path: stills/
          if-no-files-found: ignore
