name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22]
        include:
          - os: windows-latest
            node: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 依存パッケージを入れる
        run: npm ci

      - name: start.bat の確認(Windows のみ)
        if: runner.os == 'Windows'
        shell: cmd
        run: start.bat --check

      - name: 型チェック・lint・単体テスト
        run: npm run check

      - name: サンプルの静止画とはみ出しの検査
        run: npm run stills -- sample

      - name: 長い文字・多い項目のはみ出しの検査
        run: npm run stills -- projects/はみ出し確認.json

      - name: 全部品の最大・最小の入力でのはみ出しの検査
        run: npm run stress

      # 文字の描き方は OS で少し違うので、見た目の比較は基準の画像を作った Linux だけで行う
      - name: 見た目の差分の検査(Ubuntu のみ)
        if: runner.os == 'Linux'
        run: npm run visual

      - name: 自動操作テスト用のブラウザを入れる
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      - name: エディタの自動操作テスト(画面操作と MP4・PNG の書き出し)
        run: npm run e2e

      - name: 自動操作テストの結果を保存する(失敗したとき)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: 静止画を保存する
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stills-${{ matrix.os }}-node${{ matrix.node }}
          path: stills/
          if-no-files-found: ignore
